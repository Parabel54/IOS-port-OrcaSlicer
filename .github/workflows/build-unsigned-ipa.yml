name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-port

      - name: Tools
        run: |
          brew install cmake ninja autoconf automake libtool pkg-config gettext texinfo || true
          mkdir -p "$HOME/local/bin"
          ln -sf "$(which cmake)" "$HOME/local/bin/cmake"
          xcodebuild -version

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps/build-ios-iphoneos-arm64
            deps/DL_CACHE
          key: ios-deps-iphoneos-${{ hashFiles('deps/**/*.cmake', 'deps/CMakeLists.txt') }}

      - name: Build iOS deps (device, arm64)
        run: ./scripts/build_ios_deps.sh iphoneos arm64

      - name: Build libjpeg (missing from iOS dep list)
        run: |
          cmake --build deps/build-ios-iphoneos-arm64 --target dep_JPEG
          LIB=deps/build-ios-iphoneos-arm64/OrcaSlicer_dep/usr/local/lib
          rm -f "$LIB/libturbojpeg.a"
          ls -l "$LIB"/libjpeg*.a

      - name: Build engine (device, arm64)
        run: |
          ./scripts/build_ios_engine_after_deps.sh iphoneos arm64
          nm -gU build-ios-iphoneos-arm64/engine_bundle/lib/liborca_engine.a 2>/dev/null | grep -q _jpeg_CreateCompress \
            && echo "libjpeg bundled OK" || { echo "libjpeg missing from liborca_engine.a"; exit 1; }

      - name: Archive app (unsigned)
        run: |
          xcodebuild archive \
            -project ios/OrcaSlicer.xcodeproj \
            -scheme OrcaSlicer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OrcaSlicer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/OrcaSlicer.xcarchive/Products/Applications/OrcaSlicer.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OrcaSlicer-unsigned.ipa Payload
          ls -lh OrcaSlicer-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-unsigned-ipa
          path: OrcaSlicer-unsigned.ipa

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_logs/