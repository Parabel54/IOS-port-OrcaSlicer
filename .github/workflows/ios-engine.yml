name: iOS engine and app
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'deps/**'
      - 'deps_src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/*ios*'
      - 'scripts/bundle_engine_libs.sh'
      - 'scripts/tests/test_ios_project.py'
      - 'resources/**'
      - '.github/workflows/ios-engine.yml'
concurrency:
  group: ios-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check project generation
        run: python3 -m unittest discover -s scripts/tests -p test_ios_project.py -v
      - name: Check Swift and C interface
        run: bash scripts/check_ios_swift.sh "${{ matrix.sdk }}"
      - name: Install build tools
        run: brew install cmake autoconf automake libtool pkg-config
      - name: Restore SDK dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/build-ios-${{ matrix.sdk }}-arm64
          key: ios-deps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.sdk }}-${{ hashFiles('deps/**', 'cmake/**', 'scripts/build_ios_deps.sh') }}
      - name: Build dependencies
        run: bash scripts/build_ios_deps.sh "${{ matrix.sdk }}" arm64
      - name: Save SDK dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build-ios-${{ matrix.sdk }}-arm64
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: Build and bundle engine
        run: bash scripts/build_ios_engine_after_deps.sh "${{ matrix.sdk }}" arm64
      - name: Require linked engine and current profiles
        run: python3 ios/generate_xcodeproj.py --require-engine "${{ matrix.sdk }}"
      - name: Compile unsigned app
        run: |
          xcodebuild -project ios/OrcaSlicer.xcodeproj -scheme OrcaSlicer \
            -sdk "${{ matrix.sdk }}" -configuration Release \
            -derivedDataPath build-ios-app ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Exercise simulator engine
        if: matrix.sdk == 'iphonesimulator'
        run: bash scripts/test_ios_simulator.sh
      - name: Package unsigned app
        env:
          IOS_SDK: ${{ matrix.sdk }}
        run: |
          mkdir -p build-artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "build-ios-app/Build/Products/Release-${IOS_SDK}/OrcaSlicer.app" \
            "build-artifacts/OrcaSlicer-${IOS_SDK}.zip"
      - name: Preserve unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-${{ matrix.sdk }}
          path: build-artifacts/
          if-no-files-found: error
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs-${{ matrix.sdk }}
          path: build_logs/
